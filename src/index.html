<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event RSVPs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: #f3f4f6;
      --green:        #059669;
      --green-light:  #d1fae5;
      --red:          #dc2626;
      --red-light:    #fee2e2;
      --amber:        #d97706;
      --amber-light:  #fef3c7;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --shadow-md:    0 4px 12px rgba(0,0,0,.1);
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 640px; margin: 0 auto; padding: 16px; }

    /* ── Typography ─────────────────────────────────────────── */
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 8px;
    }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s, background .15s;
      text-decoration: none;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--hub-primary-fg, #ffffff); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-mid); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

    /* ── Page header ────────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }
    .page-header h1 { font-size: 1.25rem; font-weight: 700; }

    /* ── Tabs ───────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
    }
    .tab.active { background: white; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* ── Event cards ────────────────────────────────────────── */
    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
    }
    .event-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-mid); }
    .event-card.cancelled { opacity: .6; }
    .event-card-inner { padding: 14px 16px; }
    .event-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }
    .event-title { font-weight: 600; font-size: 1rem; line-height: 1.4; }
    .event-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 3px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ── RSVP chips on card ─────────────────────────────────── */
    .rsvp-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center;
      font-size: 0.71rem; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }
    .chip-yes   { background: var(--green-light); color: var(--green); }
    .chip-maybe { background: var(--amber-light); color: var(--amber); }
    .chip-no    { background: var(--red-light);   color: var(--red); }
    .chip-none  { background: #f1f5f9; color: var(--muted); }

    /* ── Badges ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      font-size: 0.71rem; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-yes       { background: var(--green-light); color: var(--green); }
    .badge-maybe     { background: var(--amber-light); color: var(--amber); }
    .badge-no        { background: var(--red-light);   color: var(--red); }
    .badge-none      { background: #f1f5f9; color: var(--muted); }
    .badge-cancelled { background: #f1f5f9; color: var(--muted); }

    .card-footer-notes { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
    .headcount-note { font-size: 0.75rem; color: var(--muted); }
    .deadline-note  { font-size: 0.75rem; color: var(--amber); }
    .deadline-note.passed { color: var(--muted); }

    /* ── Back button ────────────────────────────────────────── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.82rem; color: var(--accent); cursor: pointer;
      background: none; border: none; padding: 0; margin-bottom: 12px;
      font-weight: 600;
    }
    .back-btn:hover { opacity: .75; }

    /* ── Event detail header ────────────────────────────────── */
    .event-detail-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .event-detail-title {
      font-size: 1.2rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px;
    }
    .event-detail-meta {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 0.82rem; color: var(--muted);
    }
    .event-description {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.88rem; color: var(--text); line-height: 1.55;
    }
    .cancelled-banner {
      background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 8px;
      padding: 8px 12px; font-size: 0.82rem; color: var(--muted);
      margin-bottom: 10px; text-align: center;
    }

    /* ── RSVP section ───────────────────────────────────────── */
    .rsvp-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .rsvp-buttons { display: flex; gap: 8px; }
    .rsvp-btn {
      flex: 1; padding: 10px 8px;
      border-radius: 8px;
      border: 1.5px solid var(--border-mid);
      cursor: pointer;
      font-size: 0.85rem; font-weight: 600;
      background: var(--card); color: var(--muted);
      transition: all .15s; text-align: center;
    }
    .rsvp-btn:hover { border-color: var(--accent); color: var(--accent); }
    .rsvp-btn.active-yes   { background: var(--green-light); border-color: var(--green);  color: var(--green); }
    .rsvp-btn.active-maybe { background: var(--amber-light); border-color: var(--amber);  color: var(--amber); }
    .rsvp-btn.active-no    { background: var(--red-light);   border-color: var(--red);    color: var(--red); }
    .rsvp-extra { margin-top: 12px; }

    /* ── Breakdown ──────────────────────────────────────────── */
    .breakdown-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .breakdown-group { margin-bottom: 10px; }
    .breakdown-group:last-child { margin-bottom: 0; }
    .breakdown-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      margin-bottom: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-yes   { background: var(--green); }
    .dot-maybe { background: var(--amber); }
    .dot-no    { background: var(--red); }
    .dot-none  { background: #9ca3af; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .attendee-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.75rem; color: var(--text);
      background: var(--accent-light); border-radius: 20px;
      padding: 2px 8px 2px 3px;
    }
    .attendee-chip.muted { background: #f1f5f9; color: var(--muted); }

    /* ── Avatar ─────────────────────────────────────────────── */
    .avatar-sm {
      width: 22px; height: 22px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; color: white; flex-shrink: 0;
    }

    /* ── Actions bar ────────────────────────────────────────── */
    .actions-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 4px;
    }

    /* ── Forms ──────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: var(--muted); margin-bottom: 5px;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="datetime-local"],
    .form-group textarea {
      width: 100%;
      border: 1.5px solid var(--border-mid);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
      background: var(--card);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; min-width: 0; }

    /* ── Modal ──────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    @media (min-width: 520px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 540px;
      max-height: 92vh; overflow-y: auto;
      padding: 24px;
    }
    @media (min-width: 520px) {
      .modal { border-radius: var(--radius); }
    }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    /* ── Info / error banners ───────────────────────────────── */
    .info-banner {
      background: var(--accent-light);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem; color: var(--muted);
      margin-bottom: 12px;
    }
    .error-msg {
      background: var(--red-light); color: var(--red);
      border-radius: 8px; padding: 10px 14px;
      font-size: 0.85rem; margin-bottom: 12px;
    }

    /* ── Empty / Loading ────────────────────────────────────── */
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .loading { text-align: center; padding: 48px; color: var(--muted); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }

    /* ── Link RSVPs ─────────────────────────────────────────── */
    .guest-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .guest-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px;
      border: 1px solid var(--border, #e5e7eb);
      font-size: 0.86rem;
    }
    .guest-row.dupe { border-color: var(--amber, #f59e0b); }
    .guest-name { font-weight: 600; }
    .guest-meta { color: var(--muted); font-size: 0.8rem; }
    .guest-remove { margin-left: auto; }
  </style>
  <base href="/run/event-rsvps/">
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { hubAlert, memberColor, initial, esc, hubConfirm, sendHubNotification, createShareHelper, searchMatch } from "/hub-sdk.js";
import {
  canCreateEvent, canManageEvent, isAdult,
  isUpcoming, deadlinePassed,
  myRsvp, rsvpCounts, totalAttendees,
  guestRsvpsFor, guestTotals, duplicateGuestNames, csvCell, normalizeTimestamp,
  buildReminderNotification, summarizeReminderDelivery, searchableFields,
} from "./logic.js";

// ─── Runtime globals ──────────────────────────────────────────────────────────
const CONTEXT    = window.__CONTEXT_URL   ?? "";
const DB_URL     = window.__DB_URL        ?? "";
const APP_ID     = window.__APP_ID        ?? "event-rsvps";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const IS_ADMIN   = window.__IS_ADMIN === true;
const IS_ROSTER  = window.__SPACE_KIND === "roster";
// Who may create and manage events (and share them). In a roster only the
// steward (space admin) authors events; everyone else just RSVPs. Elsewhere any
// adult may. The hub enforces this server-side (adult_writable +
// steward_writes_only on `events`); this only hides controls that would 403.
const canSteward = (m) => IS_ROSTER ? IS_ADMIN : isAdult(m);
const EVENTS_URL = window.__EVENTS_URL    ?? "/api/events";
const share      = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);

// ─── State ────────────────────────────────────────────────────────────────────
let members        = [];
let memberMap      = new Map();
let events         = [];
let rsvps          = [];
let guestRsvps     = [];  // submitted through a share link; no member behind them
let ME             = null;  // resolved after loadMembers
let currentEventId = null;
let listTab        = "upcoming";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let _selectedStatus = ""; // tracks which RSVP button is active in detail view

// ─── DB helper ────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB_URL) return { rows: [] };
  const res = await fetch(DB_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json();
  // The hub reports a refused write as a JSON body with an `error` key
  // (403 row policy, 400 bad statement, 507 over quota). fetch() does not
  // reject on those, so without this throw every caller's rollback and
  // error toast below is unreachable code.
  if (!res.ok || json.error) throw new Error(json.error || `Database request failed (${res.status})`);
  return json;
}

// ─── Member helpers ───────────────────────────────────────────────────────────
function memberById(id) { return memberMap.get(id); }

// ─── Data loading ─────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",    role: "adult" },
      { id: "demo-2", name: "Jordan",  role: "adult" },
      { id: "demo-3", name: "Casey",   role: "child" },
      { id: "demo-4", name: "Riley",   role: "child" },
      { id: "demo-5", name: "Morgan",  role: "adult" },
    ];
    memberMap = new Map(members.map(m => [m.id, m]));
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
    memberMap = new Map(members.map(m => [m.id, m]));
  } catch { members = []; }
}

async function loadEvents() {
  if (!DB_URL) return;
  const { rows } = await db(
    `SELECT * FROM app_event_rsvps__events ORDER BY event_date ASC`
  );
  events = rows;
}

async function loadRsvps() {
  if (!DB_URL) return;
  const { rows } = await db(
    `SELECT * FROM app_event_rsvps__rsvps`
  );
  rsvps = rows;
}

async function loadGuestRsvps() {
  if (!DB_URL) return;
  const { rows } = await db(
    `SELECT * FROM app_event_rsvps__guest_rsvps`
  );
  guestRsvps = rows;
}

// ─── Actions ──────────────────────────────────────────────────────────────────
async function createEvent(data) {
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();
  const newEvent = {
    id, title: data.title, description: data.description, location: data.location,
    event_date: data.event_date, rsvp_deadline: data.rsvp_deadline || null,
    headcount: data.headcount || null, created_by: ME?.id ?? "system",
    created_at: now, cancelled: 0,
  };
  events.push(newEvent);

  await db(
    `INSERT INTO app_event_rsvps__events (id, title, description, location, event_date, rsvp_deadline, headcount, created_by, created_at)
     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
    [id, data.title, data.description, data.location, data.event_date,
     data.rsvp_deadline || null, data.headcount || null, ME?.id ?? "system", now]
  );

  await Promise.all([
    logActivity(id, "event_created", data.title),
    postHubActivity("event_created", `${ME?.name ?? "Someone"} created a new event: "${data.title}"`, id),
    sendNotification(
      `New event: ${data.title}`,
      `${ME?.name ?? "Someone"} added a new event — RSVP now!`,
      "all",
      `/open/${APP_ID}?eventId=${encodeURIComponent(id)}`
    ),
    publishEvent("event.created", id, data.title),
  ]);

  closeModal();
  currentEventId = id;
  _selectedStatus = "";
  render();
}

async function updateEvent(id, data) {
  const ev = events.find(e => e.id === id);
  if (ev) {
    ev.title         = data.title;
    ev.description   = data.description;
    ev.location      = data.location;
    ev.event_date    = data.event_date;
    ev.rsvp_deadline = data.rsvp_deadline || null;
    ev.headcount     = data.headcount || null;
  }

  await db(
    `UPDATE app_event_rsvps__events SET title=?, description=?, location=?, event_date=?, rsvp_deadline=?, headcount=? WHERE id=?`,
    [data.title, data.description, data.location, data.event_date,
     data.rsvp_deadline || null, data.headcount || null, id]
  );

  closeModal();
  render();
}

async function cancelEvent(id) {
  const ev = events.find(e => e.id === id);
  if (!await hubConfirm({
    message: `Cancel "${ev?.title ?? "this event"}"?`,
    description: "Members will not be automatically notified. Consider sending reminders first.",
    confirmLabel: "Cancel event",
    destructive: true,
  })) return;

  if (ev) ev.cancelled = 1;
  await db(`UPDATE app_event_rsvps__events SET cancelled=1 WHERE id=?`, [id]);

  await Promise.all([
    logActivity(id, "event_cancelled", ev?.title ?? ""),
    postHubActivity("event_cancelled", `${ME?.name ?? "Someone"} cancelled: "${ev?.title}"`, id),
    publishEvent("event.cancelled", id, ev?.title ?? ""),
  ]);

  currentEventId = null;
  render();
}

async function saveRsvp(eventId, status, guestCount, note) {
  const memberId = ME?.id ?? "demo";
  const now = new Date().toISOString();

  const idx      = rsvps.findIndex(r => r.event_id === eventId && r.member_id === memberId);
  const existing = idx >= 0 ? rsvps[idx] : null;
  const id       = existing?.id ?? crypto.randomUUID();

  const rsvp = { id, event_id: eventId, member_id: memberId, status, guest_count: guestCount, note, updated_at: now, visibility: "everyone" };
  if (idx >= 0) rsvps[idx] = rsvp;
  else rsvps.push(rsvp);

  _selectedStatus = status;
  render();

  // visibility='everyone' so the headcount/attendance is readable by every member;
  // the owner_or_visibility policy still restricts writes to the row's own member.
  // max_per_member forbids upsert INSERTs, so update the existing row explicitly.
  if (existing) {
    db(
      `UPDATE app_event_rsvps__rsvps SET status=?, guest_count=?, note=?, updated_at=?
       WHERE event_id=? AND member_id=?`,
      [status, guestCount, note, now, eventId, memberId]
    );
  } else {
    db(
      `INSERT INTO app_event_rsvps__rsvps (id, event_id, member_id, status, guest_count, note, updated_at, visibility)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
      [id, eventId, memberId, status, guestCount, note, now, "everyone"]
    );
  }
}

async function sendReminders(eventId) {
  if (!ME || !canSteward(ME)) return;
  const ev     = events.find(e => e.id === eventId);
  const counts = rsvpCounts(eventId, rsvps, members);
  if (!ev || counts.noResponse.length === 0) {
    hubAlert("Everyone has already responded!");
    return;
  }
  const reminder = buildReminderNotification(ev, counts.noResponse, fmtDate(ev.event_date));
  const result = await sendNotification(
    reminder.title,
    reminder.body,
    reminder.audience,
    reminder.url
  );
  hubAlert(summarizeReminderDelivery(result, reminder.audience.length));
}

// Removing a guest RSVP. The submit path only inserts and has no identity to
// dedupe on, so a visitor who corrects their own answer leaves a stale row
// behind and the headcount over-reads. This is the only way to take one back —
// which is why `guest_rsvps` is `adult_writable` rather than `endpoint_only`.
async function deleteGuestRsvp(id, eventId) {
  if (!canSteward(ME)) return;
  const row = guestRsvps.find(g => g.id === id);
  if (!row) return;
  const ok = await hubConfirm({
    message: `Remove ${row.guest_name || "this"} RSVP?`,
    description: "It came in through the shared link. Removing it lowers the headcount and cannot be undone — the visitor is not told, and they can submit again.",
    confirmLabel: "Remove",
    destructive: true,
  });
  if (!ok) return;

  const previous = guestRsvps;
  guestRsvps = guestRsvps.filter(g => g.id !== id);
  render();
  try {
    await db(`DELETE FROM app_event_rsvps__guest_rsvps WHERE id = ?`, [id]);
  } catch (e) {
    guestRsvps = previous;
    render();
    hubAlert(`Could not remove that RSVP: ${e.message}`);
    return;
  }
  logActivity(eventId, "guest_rsvp_removed", `${ME?.name ?? "Someone"} removed a link RSVP from ${row.guest_name || "an unnamed visitor"}`)
    .catch(() => {});
}

function exportCsv(eventId) {
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  const eventRsvps = rsvps.filter(r => r.event_id === eventId);
  const rows = [["Name", "Status", "Guests", "Note", "Source"]];
  for (const m of members) {
    const r = eventRsvps.find(r => r.member_id === m.id);
    rows.push([
      m.name,
      r ? r.status : "no response",
      r ? String(r.guest_count) : "0",
      r ? (r.note ?? "") : "",
      "member",
    ]);
  }
  // Link RSVPs are exported as their own rows, tagged — the caterer needs the
  // total, and the organiser needs to see which half of it nobody can vouch for.
  for (const g of guestRsvpsFor(eventId, guestRsvps)) {
    rows.push([
      g.guest_name ?? "",
      g.status ?? "",
      String(g.guest_count ?? 0),
      "",
      "shared link",
    ]);
  }
  // Every cell goes through csvCell — not just the guest ones. A member's note
  // is typed by a household member rather than the internet, but the organiser
  // opening the file cannot tell which column a payload came from, and a rule
  // applied to only some columns is one refactor away from being applied to
  // none of them.
  const csv  = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a    = document.createElement("a");
  a.href     = URL.createObjectURL(blob);
  a.download = `${ev.title.replace(/[^a-z0-9]/gi, "_")}_rsvps.csv`;
  a.click();
}

// ─── Date formatting ──────────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function fmtDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) +
    " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function fmtDateShort(iso) {
  if (!iso) return "";
  // Guest rows' created_at is SQLite's space-separated UTC default, not ISO.
  const d   = new Date(normalizeTimestamp(iso));
  const now = new Date();
  const opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("en-US", opts);
}

function toLocalInput(iso) {
  if (!iso) return "";
  const d   = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  const premiumControls = _shareEntitled ? `
    <label style="display:flex;gap:6px;align-items:center;font-size:0.85rem;margin-top:10px">
      <input type="checkbox" id="share-writable" /> Let guests RSVP through this link

      <select id="share-expiry" style="padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:0.85rem">
        <option value="24">1 day</option>
        <option value="168" selected>7 days</option>

        ${_shareEntitled ? `<option value="8760">1 year</option>` : ""}

      <button class="btn btn-primary btn-sm" data-action="create-share" data-id="${esc(eventId)}">Create link</button>

async function createShare(eventId) {
  const ev = events.find(e => e.id === eventId);
  const hours = Number(document.getElementById("share-expiry")?.value) || undefined;
  const writable = !!document.getElementById("share-writable")?.checked;
  const password = document.getElementById("share-password")?.value?.trim() || undefined;
  const btn = modalEl?.querySelector('[data-action="create-share"]');
  if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }
  try {
    const link = await share.create("event", eventId, { expiresInHours: hours, label: ev?.title, writable, password });
    try { await navigator.clipboard.writeText(link.url); } catch { /* re-render shows the url to copy manually */ }
    await openShareModal(eventId); // refresh the list in place
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "Create link"; }
    hubAlert("Couldn't create share link", { description: err.message });
  }
}

async function copyShare(id) {
  const link = _shareLinks.find(l => l.id === id);
  if (!link) return;
  try { await navigator.clipboard.writeText(link.url); }
  catch { hubAlert("Couldn't copy — select the link text and copy it manually."); }
}

async function revokeShare(id, eventId) {
  if (!await hubConfirm("Revoke this share link?", { description: "Anyone using it will immediately lose access.", confirmLabel: "Revoke" })) return;
  try {
    await share.revoke(id);
    await openShareModal(eventId);
  } catch (err) {
    hubAlert("Couldn't revoke share link", { description: err.message });
  }
}

window.submitEvent = async function(existingId) {
  const title     = document.getElementById("f-title").value.trim();
  const dateVal   = document.getElementById("f-date").value;
  const deadline  = document.getElementById("f-deadline").value;
  const location  = document.getElementById("f-location").value.trim();
  const desc      = document.getElementById("f-desc").value.trim();
  const headcount = parseInt(document.getElementById("f-headcount").value) || null;
  const errEl     = document.getElementById("event-error");

  if (!title)   { showErr(errEl, "Title is required.");         return; }
  if (!dateVal) { showErr(errEl, "Date & time is required.");   return; }
  errEl.style.display = "none";

  const btn = modalEl?.querySelector(".btn-primary");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

  try {
    const data = {
      title,
      description:  desc,
      location,
      event_date:   new Date(dateVal).toISOString(),
      rsvp_deadline: deadline ? new Date(deadline).toISOString() : null,
      headcount,
    };
    if (existingId) await updateEvent(existingId, data);
    else            await createEvent(data);
  } catch {
    if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save Changes" : "Create Event"; }
  }
};

function showErr(el, msg) { el.textContent = msg; el.style.display = "block"; }

// ─── Rendering helpers ────────────────────────────────────────────────────────
function renderRsvpChips(eventId) {
  const c = rsvpCounts(eventId, rsvps, members);
  const parts = [];
  if (c.yes.length)        parts.push(`<span class="chip chip-yes">✓ ${c.yes.length} going</span>`);
  if (c.maybe.length)      parts.push(`<span class="chip chip-maybe">? ${c.maybe.length} maybe</span>`);
  if (c.no.length)         parts.push(`<span class="chip chip-no">✗ ${c.no.length} not going</span>`);
  if (c.noResponse.length) parts.push(`<span class="chip chip-none">— ${c.noResponse.length} no response</span>`);
  return parts.length ? `<div class="rsvp-chips">${parts.join("")}</div>` : "";
}

function myRsvpBadge(eventId) {
  const r = myRsvp(eventId, rsvps, ME?.id ?? "");
  if (!r)                  return `<span class="badge badge-none">No response</span>`;
  if (r.status === "yes")  return `<span class="badge badge-yes">Going</span>`;
  if (r.status === "maybe")return `<span class="badge badge-maybe">Maybe</span>`;
  return `<span class="badge badge-no">Not going</span>`;
}

function renderList() {
  const upcoming = events.filter(e => isUpcoming(e));
  const past     = events.filter(e => !isUpcoming(e));
  const scoped   = listTab === "upcoming" ? upcoming : past;
  const showing  = searchQ ? scoped.filter(e => searchMatch(searchQ, searchableFields(e))) : scoped;
  const canCreate = canCreateEvent(ME) && (!IS_ROSTER || IS_ADMIN);

  document.getElementById("root").innerHTML = `
    <div class="page-header">
      <h1>Event RSVPs</h1>
      ${canCreate ? `<button class="btn btn-primary btn-sm" onclick="openCreateEventModal()">+ New Event</button>` : ""}
    </div>

    <div class="tabs">
      <button class="tab ${listTab === "upcoming" ? "active" : ""}" onclick="setTab('upcoming')">
        Upcoming${upcoming.length > 0 ? ` (${upcoming.length})` : ""}
      </button>
      <button class="tab ${listTab === "past" ? "active" : ""}" onclick="setTab('past')">
        Past${past.length > 0 ? ` (${past.length})` : ""}
      </button>
    </div>

    ${events.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search events…" aria-label="Search events" value="${esc(searchQ)}" /></div>` : ""}
    <div id="event-list">${showing.length === 0
      ? (searchQ
        ? `<div class="empty"><div class="empty-icon">🔍</div><p>No events match "${esc(searchQ)}".</p></div>`
        : `<div class="empty">
           <div class="empty-icon">${listTab === "upcoming" ? "🎟️" : "📋"}</div>
           <p>${listTab === "upcoming"

         </div>`)

  // renderList rewrites the whole view, so put the caret back after typing.

  if (searchQ && searchEl) {
    searchEl.focus();
    searchEl.setSelectionRange(searchQ.length, searchQ.length);
  }
}

// ─── Detail view ──────────────────────────────────────────────────────────────
function renderDetail(ev) {
  const canManage    = canManageEvent(ev, ME) && (!IS_ROSTER || IS_ADMIN);
  const cancelled    = !!ev.cancelled;
  const deadlinePast = deadlinePassed(ev);
  const canRsvp      = !cancelled && !deadlinePast && ME;
  const counts       = rsvpCounts(ev.id, rsvps, members);
  const myR          = myRsvp(ev.id, rsvps, ME?.id ?? "");
  const creator      = memberById(ev.created_by);

  // ── RSVP section ──
  const currentStatus = _selectedStatus || myR?.status || "";
  const currentGuests = myR?.guest_count ?? 0;
  const currentNote   = myR?.note ?? "";

  let rsvpSection = "";
  if (canRsvp) {
    rsvpSection = `
      <div class="rsvp-section">
        <div class="section-label" style="margin-bottom:10px">Your RSVP</div>
        <div class="rsvp-buttons">
          <button class="rsvp-btn ${currentStatus === "yes"   ? "active-yes"   : ""}" onclick="selectRsvp('yes')">✓ Going</button>
          <button class="rsvp-btn ${currentStatus === "maybe" ? "active-maybe" : ""}" onclick="selectRsvp('maybe')">? Maybe</button>
          <button class="rsvp-btn ${currentStatus === "no"    ? "active-no"    : ""}" onclick="selectRsvp('no')">✗ Not Going</button>
        </div>
        <div class="rsvp-extra" id="rsvp-extra" style="${currentStatus ? "" : "display:none"}">
          <div class="form-row" style="margin-top:12px">
            <div class="form-group" style="flex:0 0 110px">
              <label>Guests</label>
              <input type="number" id="rsvp-guests" min="0" max="20" value="${currentGuests}" />
            </div>
            <div class="form-group" style="flex:1">
              <label>Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
              <input type="text" id="rsvp-note" value="${esc(currentNote)}"
                placeholder="Dietary needs, arriving late…" />
            </div>
          </div>
          <button class="btn btn-primary btn-sm" id="rsvp-save-btn" data-action="submit-rsvp" data-id="${esc(ev.id)}">
            ${myR ? "Update RSVP" : "Save RSVP"}
          </button>
          ${myR ? `<span style="font-size:0.76rem;color:var(--muted);margin-left:10px">Updated ${fmtDateShort(myR.updated_at)}</span>` : ""}
        </div>
      </div>
    `;
  } else if (cancelled) {
    rsvpSection = `<div class="info-banner">This event was cancelled.</div>`;
  } else if (deadlinePast) {
    rsvpSection = `<div class="info-banner">The RSVP deadline has passed.</div>`;
  } else if (!ME) {
    rsvpSection = `<div class="info-banner">Sign in to RSVP.</div>`;
  }

  // ── Attendee chips ──
  function memberChips(rsvpList) {
    return rsvpList.map(r => {
      const m = memberById(r.member_id);
      if (!m) return "";
      const guests = r.guest_count > 0 ? ` +${r.guest_count}` : "";
      return `<span class="attendee-chip">
        <span class="avatar-sm" style="background:${memberColor(m.id)}">${initial(m.name)}</span>
        ${esc(m.name)}${guests}
      </span>`;
    }).join("");
  }

  function noResponseChips(memberList) {
    return memberList.map(m => `
      <span class="attendee-chip muted">
        <span class="avatar-sm" style="background:#9ca3af">${initial(m.name)}</span>
        ${esc(m.name)}
      </span>
    `).join("");
  }

  const goingLabel = counts.yes.length > 0
    ? `Going (${totalAttendees(ev.id, rsvps)} incl. guests)`
    : "Going";

  const attendeesSection = `
    <div class="breakdown-section">
      <div class="section-label">Attendance</div>
      ${counts.yes.length > 0 ? `
        <div class="breakdown-group">
          <div class="breakdown-label"><span class="dot dot-yes"></span>${goingLabel}</div>
          <div class="chip-row">${memberChips(counts.yes)}</div>
        </div>
      ` : ""}
      ${counts.maybe.length > 0 ? `
        <div class="breakdown-group">
          <div class="breakdown-label"><span class="dot dot-maybe"></span>Maybe (${counts.maybe.length})</div>
          <div class="chip-row">${memberChips(counts.maybe)}</div>
        </div>
      ` : ""}
      ${counts.no.length > 0 ? `
        <div class="breakdown-group">
          <div class="breakdown-label"><span class="dot dot-no"></span>Not going (${counts.no.length})</div>
          <div class="chip-row">${memberChips(counts.no)}</div>
        </div>
      ` : ""}
      ${counts.noResponse.length > 0 ? `
        <div class="breakdown-group">
          <div class="breakdown-label"><span class="dot dot-none"></span>No response (${counts.noResponse.length})</div>
          <div class="chip-row">${noResponseChips(counts.noResponse)}</div>
        </div>
      ` : `<p style="font-size:0.85rem;color:var(--muted)">Everyone has responded.</p>`}
    </div>
  `;

  // ── RSVPs from the shared link ──
  // Kept in their own section, never folded into the member counts above: these
  // are anonymous submissions, and an organiser reading a catering number needs
  // to know which part of it is people the household can actually name.
  const linkRows  = guestRsvpsFor(ev.id, guestRsvps);
  const linkTotal = guestTotals(ev.id, guestRsvps);
  const dupes     = duplicateGuestNames(ev.id, guestRsvps);
  const guestSection = linkRows.length === 0 ? "" : `
    <div class="breakdown-section">
      <div class="section-label">From the shared link</div>
      <div class="breakdown-group">
        <div class="breakdown-label">
          <span class="dot dot-yes"></span>${linkTotal.heads} coming
          <span style="font-weight:400;color:var(--muted)">
            · ${linkTotal.going} response${linkTotal.going === 1 ? "" : "s"}${linkTotal.maybe ? ` · ${linkTotal.maybe} maybe` : ""}
          </span>
        </div>
        ${dupes.size > 0 ? `
          <div class="info-banner" style="margin:8px 0">
            Some names responded more than once. A link RSVP can't be edited, so a
            correction arrives as a second row — remove the stale one to fix the count.
          </div>
        ` : ""}
        <div class="guest-list">
          ${linkRows.map(g => {
            const name = (g.guest_name ?? "").trim();
            const dupe = name && dupes.has(name.toLowerCase());
            return `
              <div class="guest-row${dupe ? " dupe" : ""}">
                <span class="guest-name">${esc(name || "Unnamed visitor")}</span>
                <span class="guest-meta">
                  ${g.status === "maybe" ? "maybe · " : ""}${Number(g.guest_count) || 0} ${Number(g.guest_count) === 1 ? "person" : "people"}
                  ${g.created_at ? ` · ${fmtDateShort(g.created_at)}` : ""}
                </span>
                ${canSteward(ME) ? `
                  <button class="btn btn-ghost btn-sm guest-remove"
                    data-action="delete-guest" data-id="${esc(g.id)}" data-event-id="${esc(ev.id)}">Remove</button>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>
      </div>
    </div>
  `;

  // External sharing is adult-gated (hub enforces role + household policy), not
  // manager-gated: any adult may pass a public link along. Cancelled events are
  // excluded to match the manifest's visible_where gate on the public page.
  const shareBtn = share.enabled && canSteward(ME) && !cancelled
    ? `<button class="btn btn-ghost btn-sm" data-action="share-event" data-id="${esc(ev.id)}">🔗 Share</button>`
    : "";
  const actionsBar = canManage && !cancelled ? `
    <div class="actions-bar">
      <button class="btn btn-ghost btn-sm" data-action="edit-event" data-id="${esc(ev.id)}">✏️ Edit</button>
      ${shareBtn}
      <button class="btn btn-ghost btn-sm" data-action="send-reminders" data-id="${esc(ev.id)}">🔔 Send Reminders</button>
      <button class="btn btn-ghost btn-sm" data-action="export" data-id="${esc(ev.id)}">⬇️ Export CSV</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red);opacity:.8"
        data-action="cancel-event" data-id="${esc(ev.id)}">Cancel Event</button>
    </div>
  ` : (shareBtn ? `<div class="actions-bar">${shareBtn}</div>` : "");

  document.getElementById("root").innerHTML = `
    <button class="back-btn" onclick="backToList()">← All Events</button>

    <div class="event-detail-header">
      ${cancelled ? `<div class="cancelled-banner">This event was cancelled.</div>` : ""}
      <div class="event-detail-title">${esc(ev.title)}</div>
      <div class="event-detail-meta">
        <span>📅 ${fmtDateTime(ev.event_date)}</span>
        ${ev.location ? `<span>📍 ${esc(ev.location)}</span>` : ""}
        ${ev.rsvp_deadline ? `<span class="deadline-note ${deadlinePast ? "passed" : ""}">
          RSVP ${deadlinePast ? "closed" : "deadline"}: ${fmtDateTime(ev.rsvp_deadline)}
        </span>` : ""}
        ${ev.headcount ? `<span>Headcount needed: ${ev.headcount}</span>` : ""}
        ${creator ? `<span style="font-size:0.78rem">Created by ${esc(creator.name)}</span>` : ""}
      </div>
      ${ev.description ? `<div class="event-description">${esc(ev.description)}</div>` : ""}
    </div>

    ${rsvpSection}
    ${attendeesSection}
    ${guestSection}
    ${actionsBar}

    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-ghost btn-sm" onclick="backToList()">← Back to events</button>
    </div>
  `;
}

// ─── RSVP interaction ─────────────────────────────────────────────────────────
window.selectRsvp = function(status) {
  _selectedStatus = status;
  document.querySelectorAll(".rsvp-btn").forEach(btn => {
    btn.classList.remove("active-yes", "active-maybe", "active-no");
  });
  const cls  = { yes: "active-yes", maybe: "active-maybe", no: "active-no" }[status];
  const idx  = { yes: 0, maybe: 1, no: 2 }[status];
  const btns = document.querySelectorAll(".rsvp-btn");
  if (btns[idx]) btns[idx].classList.add(cls);
  const extra = document.getElementById("rsvp-extra");
  if (extra) extra.style.display = "";
};

window.submitRsvp = function(eventId) {
  if (!_selectedStatus) return;
  const guestCount = parseInt(document.getElementById("rsvp-guests")?.value) || 0;
  const note       = document.getElementById("rsvp-note")?.value.trim() ?? "";
  saveRsvp(eventId, _selectedStatus, guestCount, note);
};

// ─── Navigation ───────────────────────────────────────────────────────────────
window.openEvent = function(id) {
  _selectedStatus = myRsvp(id, rsvps, ME?.id ?? "")?.status ?? "";
  currentEventId  = id;
  render();
};
window.backToList       = function()  { currentEventId = null; render(); };
window.setTab           = function(t) { listTab = t; render(); };
window.openCreateEventModal = openCreateEventModal;
window.doSendReminders  = function(id) { sendReminders(id); };
window.doExport         = function(id) { exportCsv(id); };
window.doCancelEvent    = function(id) { cancelEvent(id); };

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  if (currentEventId) {
    const ev = events.find(e => e.id === currentEventId);
    if (ev) { renderDetail(ev); return; }
    currentEventId = null;
  }
  renderList();
}

// ─── Deep linking ─────────────────────────────────────────────────────────────
function handleDeepLink() {
  const eventId = new URLSearchParams(window.location.search).get("eventId");
  if (eventId) openEvent(eventId);
}

// ─── Delegated click handling ─────────────────────────────────────────────────
// Data-bearing controls carry attacker-influenced values (event ids are member-
// writable via raw /api/db), so they use data-* attributes + delegation rather
// than inline onclick="fn('${id}')" — HTML-escaping a value does not make it safe
// inside an inline handler (entities decode back before the JS string is parsed).
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.id ?? "";
  switch (el.dataset.action) {
    case "open-event":     window.openEvent(id); break;
    case "submit-event":   window.submitEvent(id); break;
    case "submit-rsvp":    window.submitRsvp(id); break;
    case "edit-event":     window.openCreateEventModal(id || null); break;
    case "send-reminders": window.doSendReminders(id); break;
    case "export":         window.doExport(id); break;
    case "cancel-event":   window.doCancelEvent(id); break;
    case "share-event":    openShareModal(id); break;
    case "create-share":   createShare(id); break;
    case "copy-share":     copyShare(id); break;
    case "revoke-share":   revokeShare(id, el.dataset.eventId ?? ""); break;
    case "delete-guest":   deleteGuestRsvp(id, el.dataset.eventId ?? ""); break;
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  await loadMembers();

  if (HUB_MEMBER) {
    ME = members.find(m => m.id === HUB_MEMBER.id) ?? HUB_MEMBER;
  } else if (!DB_URL) {
    ME = members.find(m => m.role === "adult") ?? members[0] ?? null;
  }

  if (!DB_URL) {
    loadDemoData();
  } else {
    await Promise.all([loadEvents(), loadRsvps(), loadGuestRsvps()]);
  }

  render();
  handleDeepLink();
})();
